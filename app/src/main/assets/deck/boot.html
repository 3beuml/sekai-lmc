<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deck engine</title>
  <style>
    body { font: 13px/1.45 monospace; margin: 10px; color: #ddd; background: #121212; }
    #log { white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
<div id="log">booting…</div>
<script type="module">
  import init, { load_masterdata, recommend } from "/allium_deck.js";

  const log = (text) => {
    const el = document.getElementById("log");
    if (el) el.textContent = text;
  };

  // 宿主（Kotlin）注入的对象叫 DeckBridge。任何一步失败都**原样**把错误文本回传，
  // 不做任何"友好化"—— 排查靠的就是引擎原始的报错。
  const post = (kind, payload) => {
    try { window.DeckBridge.post(kind, String(payload)); }
    catch (e) { log("bridge missing: " + e); }
  };

  window.addEventListener("error", (e) => post("error", "window.error: " + e.message));
  window.addEventListener("unhandledrejection", (e) => post("error", "unhandled: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));

  // 从文件载入 masterdata：Kotlin 侧不走 evaluateJavascript 传大字符串
  // （那条路会对 15 MB JSON 做逐字符转义，实测一次要分配 148 MB，直接 OOM）。
  //
  // 第二个参数 `musicMetasUrl` 是 per-song 的分数/PT 系数表（2.4 MB）。它同样走文件通道，
  // 而且是 `load_masterdata` 的**第二个入参** —— 算「分数 / 活动 PT」必须给它，
  // 但算「综合力」用不上。没给时传 `"[]"`：**不能传空串**（引擎会直接 JSON.parse 空串，
  // 报 `EOF while parsing a value at line 1 column 0`）。
  const loadFromUrl = async (masterUrl, musicMetasUrl) => {
    try {
      const res = await fetch(masterUrl);
      const text = await res.text();
      let music = "[]";
      if (musicMetasUrl) {
        const mres = await fetch(musicMetasUrl);
        const mtext = await mres.text();
        if (mtext && mtext.trim().length > 2) music = mtext;
      }
      load_masterdata(text, music);
      post("loaded", "ok master=" + text.length + " musicMetas=" + music.length);
      return "ok";
    } catch (e) {
      post("error", "load_from_url: " + (e && e.message ? e.message : e));
      return "error";
    }
  };

  window.deckBoot = {
    loadFromUrl: (masterUrl, musicMetasUrl) => loadFromUrl(masterUrl, musicMetasUrl),
    // 载入 masterdata：masterJson 是 {"cards":"<表原文>", …} 的字符串
    load: (masterJson) => {
      try {
        // 第二个参数是 music_metas 表原文。不能给空字符串 —— 引擎会直接 JSON.parse 它，
        // 于是报「EOF while parsing a value at line 1 column 0」。给空数组表示没有曲目元数据
        // （target=power 不需要曲目系数）。
        load_masterdata(masterJson, "[]");
        post("loaded", "ok");
        return "ok";
      } catch (e) {
        post("error", "load_masterdata: " + (e && e.message ? e.message : e));
        return "error";
      }
    },
    // 组卡：userJson / paramsJson 都是字符串
    run: (userJson, paramsJson) => {
      const started = Date.now();
      try {
        const out = recommend(userJson, paramsJson);
        post("result", out);
        post("elapsed", String(Date.now() - started));
        return "ok";
      } catch (e) {
        post("error", "recommend: " + (e && e.message ? e.message : e));
        return "error";
      }
    },
  };

  try {
    await init();
    log("wasm ready");
    post("ready", "ok");
  } catch (e) {
    post("error", "init: " + (e && e.message ? e.message : e));
  }
</script>
</body>
</html>
