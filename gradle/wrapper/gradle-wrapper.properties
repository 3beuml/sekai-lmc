distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 用国内镜像下载 Gradle 发行包。
# 官方地址 https://services.gradle.org/distributions/gradle-8.9-bin.zip 在中国大陆经常连接超时
# （报 java.net.SocketTimeoutException: Connect timed out），所以默认走国内镜像。
#
# 以下地址均经「Range 请求」实测返回 206，确认文件真实存在：
#   华为云      https://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip        ← 当前使用
#   腾讯云      https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip
#   Gradle CDN  https://downloads.gradle.org/distributions/gradle-8.9-bin.zip
#
# ⚠️ 不要用 mirrors.aliyun.com/gradle/ —— 实测返回 404（该路径下没有 Gradle 发行包）。
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip
# 30 秒而不是默认的 10 秒：弱网下 10 秒容易在下载半途超时，重下 136 MB 很浪费时间。
# 本机已经装好了这份发行版（~/.gradle/wrapper/dists/gradle-8.9-bin/），平时不会再触发下载。
networkTimeout=30000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
