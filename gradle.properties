org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 显式指定「跑 Gradle 用哪个 JDK」。
#
# 原因：Android Studio 自带的 JBR 是 JDK 25，而 Gradle 8.9 只支持到 JDK 22，
# 用默认 JBR 同步会直接失败（Unsupported class file major version）。
# 本机 C:\Program Files\Java\jdk-21 是现成可用的 JDK 21。
#
# 优先级提醒：Android Studio 里 Settings → Build Tools → Gradle → Gradle JDK
# 的显式选择**高于**这一行；如果那边选了别的 JDK，这一行不生效。
# 用正斜杠是为了避免 properties 文件里反斜杠需要转义。
org.gradle.java.home=C:/Program Files/Java/jdk-21

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.7.3 官方只测到 compileSdk 35，本项目用 36。加这行压掉每次构建都刷的警告，不影响产物。
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
